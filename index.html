<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Phạm Hồng Loan</title>
  <style>
    /* DESIGN TOKENS & ANTI-COPY */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none; /* Khóa bôi đen / copy */
    }

    body {
      background-color: #111111; /* Nền tối tôn vinh Slide Canva */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* CLICK ZONES (Nửa Trái Lùi / Nửa Phải Tiến) */
    .click-zone {
      position: fixed;
      top: 0;
      height: 100vh;
      width: 50vw;
      z-index: 500;
      cursor: pointer;
    }
    #zone-left { left: 0; }
    #zone-right { right: 0; }

    /* SLIDER CONTAINER */
    .slider-wrapper {
      display: flex;
      width: 900vw; /* 9 Ảnh Slide Canva */
      height: 100vh;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* KHUNG ẢNH CANVA CHUẨN ĐỒNG NHẤT 100% KÍCH THƯỚC */
    .slide-img-container {
      max-width: 95vw;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      background: #fff;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0.85;
      transform: scale(0.97);
    }

    .slide.active-slide .slide-img-container {
      opacity: 1;
      transform: scale(1);
    }

    .slide-img-container img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      display: block;
      pointer-events: none; /* Khóa kéo thả ảnh */
    }

    /* HIỆU ỨNG NHẤP NHÁY NHỊP THỞ CHO SLIDE ĐẦU & CUỐI */
    .slide:first-child.active-slide .slide-img-container,
    .slide:last-child.active-slide .slide-img-container {
      animation: pulseGlow 3s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.08); }
    }

    /* CHẤM TRÒN ĐIỀU HƯỚNG BÊN DƯỚI */
    .dots-container {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 1000;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }

    .dot {
      width: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active-dot {
      background: #7bc4b2;
      width: 24px;
      border-radius: 6px;
    }
  </style>
</head>
<body oncontextmenu="return false;"> <!-- Khóa chuột phải -->

  <!-- Vùng Click Chuyển Slide -->
  <div class="click-zone" id="zone-left" onclick="prevSlide()" title="Click nửa trái để Lùi"></div>
  <div class="click-zone" id="zone-right" onclick="nextSlide()" title="Click nửa phải để Tiến"></div>

  <!-- Khung Slider Ảnh Canva -->
  <div class="slider-wrapper" id="sliderWrapper">
    <div class="slide active-slide"><div class="slide-img-container"><img src="0.png" alt="Slide 1"></div></div>
    <div class="slide"><div class="slide-img-container"><img src="1.png" alt="Slide 2"></div></div>
    <div class="slide"><div class="slide-img-container"><img src="2.png" alt="Slide 3"></div></div>
    <div class="slide"><div class="slide-img-container"><img src="3.png" alt="Slide 4"></div></div>
    <div class="slide"><div class="slide-img-container"><img src="4.png" alt="Slide 5"></div></div>
    <div class="slide"><div class="slide-img-container"><img src="5.png" alt="Slide 6"></div></div>
    <div class="slide"><div class="slide-img-container"><img src="6.png" alt="Slide 7"></div></div>
    <div class="slide"><div class="slide-img-container"><img src="7.png" alt="Slide 8"></div></div>
    <div class="slide"><div class="slide-img-container"><img src="8.png" alt="Slide 9"></div></div>
  </div>

  <!-- Thanh Chấm Tròn Chuyển Slide -->
  <div class="dots-container" id="dotsContainer"></div>

  <script>
    let currentSlide = 0;
    const totalSlides = 9;
    const sliderWrapper = document.getElementById('sliderWrapper');
    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dotsContainer');

    // Tạo chấm tròn điều hướng
    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (i === 0) dot.classList.add('active-dot');
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        goToSlide(i);
      });
      dotsContainer.appendChild(dot);
    }

    function updateSlider() {
      sliderWrapper.style.transform = `translateX(-${currentSlide * 100}vw)`;
      slides.forEach((slide, index) => {
        if (index === currentSlide) {
          slide.classList.add('active-slide');
        } else {
          slide.classList.remove('active-slide');
        }
      });
      document.querySelectorAll('.dot').forEach((dot, index) => {
        dot.classList.toggle('active-dot', index === currentSlide);
      });
    }

    function goToSlide(index) {
      currentSlide = index;
      updateSlider();
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) currentSlide++;
      else currentSlide = 0;
      updateSlider();
    }

    function prevSlide() {
      if (currentSlide > 0) currentSlide--;
      else currentSlide = totalSlides - 1;
      updateSlider();
    }

    // Điều khiển bằng phím mũi tên bàn phím
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    // Chống F12, Ctrl+C, Ctrl+U, Ctrl+S
    document.onkeydown = function(e) {
      if (e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 67 || e.keyCode == 83))) {
        return false;
      }
    };
  </script>
</body>
</html>
