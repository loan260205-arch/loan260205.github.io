<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Ảnh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .gallery img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>Danh sách ảnh</h1>
    <div class="gallery">
        <img src="0.png" alt="Ảnh 0">
        <img src="1.png" alt="Ảnh 1">
        <img src="2.png" alt="Ảnh 2">
        <img src="3.png" alt="Ảnh 3">
        <img src="4.png" alt="Ảnh 4">
        <img src="5.png" alt="Ảnh 5">
        <img src="6.png" alt="Ảnh 6">
        <img src="7.png" alt="Ảnh 7">
        <img src="8.png" alt="Ảnh 8">
    </div>
</body>
</html>
